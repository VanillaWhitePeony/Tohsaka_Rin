# =============================================================================
# i18n Content Translations
# =============================================================================
# Non-default locale translations for content-level strings.
# Default locale (zh) values come from config/site.yaml — only add overrides here.
#
# Structure:
#   <locale>:
#     categories:    { <slug>: <translated name> }
#     series:        { <slug>: { label?, fullName?, description? } }
#     featuredCategories: { <link>: { label?, description? } }
#     colophon:      { groups: { <id>: <label> }, marks: { <id>: { label?, description? } } }
# =============================================================================

en:
  colophon:
    groups:
      authorship: Written by
      notice: Heads-up
    marks:
      handwritten: { label: Handwritten, description: Every word here was typed by me. }
      ai-cowrite: { label: Co-written with AI, description: "I wrote it; AI helped shape ideas and wording." }
      ai-lead: { label: AI-drafted, description: "AI drafted most of the text; I selected and edited it." }
      spoiler: { label: Spoilers, description: Discusses later plot points. Maybe bookmark it until you catch up. }
      outdated: { label: Possibly outdated, description: "Written a while ago; versions and approaches may have changed." }

ja:
  colophon:
    groups:
      authorship: 執筆
      notice: ご注意
    marks:
      handwritten: { label: 手書き, description: 一字一句、自分で書きました。 }
      ai-cowrite: { label: AI と共作, description: 主筆は私、AI には構成や言い回しを手伝ってもらいました。 }
      ai-lead: { label: AI 主筆, description: 本文の大半は AI が下書きし、私が選んで手直ししました。 }
      spoiler: { label: ネタバレあり, description: 作品の後半の展開に触れています。未視聴ならブックマークしてからどうぞ。 }
      outdated: { label: 情報が古い可能性, description: 少し前に書いた記事なので、バージョンややり方が変わっているかもしれません。 }

ko:
  colophon:
    groups:
      authorship: 집필
      notice: 읽기 전에
    marks:
      handwritten: { label: 직접 씀, description: 모든 글자를 제가 직접 썼어요. }
      ai-cowrite: { label: AI와 함께 씀, description: 제가 쓰고 AI가 구성과 표현을 도와줬어요. }
      ai-lead: { label: AI 초안, description: 본문 대부분은 AI가 초안을 쓰고 제가 골라 다듬었어요. }
      spoiler: { label: 스포일러, description: 작품 후반부 내용을 다룹니다. 아직 안 보셨다면 북마크해 두세요. }
      outdated: { label: 오래된 내용일 수 있음, description: 예전에 쓴 글이라 버전이나 방법이 바뀌었을 수 있어요. }
